[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-pre-commit-hooks"
version = "0.1.0"
description = "Pre-commit hooks for cleaning up LaTeX source files"
requires-python = ">=3.8"

[project.scripts]
replace-latex-math = "latex_pre_commit_hooks.replace_math:main"
fix-nbsp = "latex_pre_commit_hooks.fix_nbsp:main"
latex-syntax-cleaner = "latex_pre_commit_hooks.latex_cleaner:main"

[tool.setuptools]
packages = ["latex_pre_commit_hooks"]
